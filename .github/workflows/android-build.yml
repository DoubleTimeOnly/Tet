name: Android build

# Manual only. Trigger from the Actions tab, or:
#   gh workflow run android-build.yml --ref <branch>
on:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build APK on EAS
        id: build
        run: |
          eas build --profile preview --platform android --non-interactive --json > build.json
          cat build.json

      - name: Publish install link
        run: |
          {
            echo "## Android build finished"
            echo
            echo "- Build page: $(jq -r '.[0].buildDetailsPageUrl' build.json)"
            echo "- APK: $(jq -r '.[0].artifacts.buildUrl' build.json)"
            echo "- Branch: ${{ github.ref_name }} (${{ github.sha }})"
          } >> "$GITHUB_STEP_SUMMARY"
